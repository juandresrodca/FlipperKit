name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # A clean resolve of exactly what pyproject.toml asks for — the same thing a
      # user gets, so a missing dependency fails here rather than on their machine.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
