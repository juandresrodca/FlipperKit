version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # One pull request for the routine bumps keeps the queue readable for a project
      # whose review time is better spent on parsers than on separate typer and rich
      # patch bumps. Covers the four runtime dependencies and the dev extra, both
      # declared in pyproject.toml at the repository root.
      all-pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
