[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flipperkit"
version = "0.1.0"
description = "A companion CLI toolkit for the Flipper Zero — backup, parse, index and report on captured artifacts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "juandresrodca" }]
keywords = ["flipper-zero", "security", "cli", "rfid", "nfc", "subghz", "hardware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
flipperkit = "flipperkit.cli:main"

[project.urls]
Homepage = "https://github.com/juandresrodca/FlipperKit"
Issues = "https://github.com/juandresrodca/FlipperKit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
